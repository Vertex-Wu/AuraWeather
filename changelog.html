<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史版本 - AuraWeather</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --bg: #050505;
            --text-main: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #888888;
            --brand-blue: #007aff;
            --brand-purple: #af52de;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.3);
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", "Fira Code", monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { background-color: var(--bg); color: var(--text-main); font-family: var(--font-sans); line-height: 1.6; overflow-x: hidden; }
        
        /* 全局噪点与极光 */
        body::before { content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.04; }
        .fluid-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 0%, #111827 0%, #000 70%); }
        .blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4; animation: float 20s infinite alternate; }
        .blob-1 { width: 50vw; height: 50vw; background: var(--brand-blue); top: 10vh; left: -20vw; }
        .blob-2 { width: 60vw; height: 60vw; background: var(--brand-purple); bottom: -10vh; right: -10vw; animation-delay: -5s; }
        @keyframes float { 100% { transform: translate(5%, 10%) scale(1.1); } }

        /* 导航栏 */
        nav { position: fixed; top: 0; width: 100%; height: 70px; z-index: 1000; display: flex; justify-content: center; align-items: center; background: rgba(5, 5, 5, 0.5); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
        .nav-inner { width: 100%; max-width: 1200px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; }
        .brand img { width: 32px; height: 32px; border-radius: 8px; }
        .nav-links { display: flex; gap: 32px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }

        /* 头部 */
        .header { text-align: center; padding: 160px 24px 60px; }
        .header h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; background: linear-gradient(180deg, #fff 30%, #888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 20px; color: var(--text-muted); }

        /* 表格容器 */
        .table-container { max-width: 1000px; margin: 0 auto 120px; padding: 0 24px; }
        .glass-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 40px; backdrop-filter: blur(20px); box-shadow: inset 0 1px 1px var(--glass-highlight), 0 10px 40px rgba(0,0,0,0.4); overflow-x: auto; }

        /* 表格样式 */
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 20px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        td { font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .version-tag { font-family: "SF Mono", monospace; font-weight: 700; font-size: 18px; color: #fff; }
        .date-text { color: var(--text-muted); font-size: 14px; font-family: "SF Mono", monospace; }
        .desc-text { color: var(--text-secondary); }

        /* 下载按钮组 */
        .download-actions { display: flex; gap: 12px; }
        .btn-sm { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; transition: all 0.2s; cursor: pointer; }
        
        /* 核心修改：高速用实色蓝底，普通用暗色底 */
        .btn-fast { background: var(--brand-blue); color: #fff; border: 1px solid var(--brand-blue); box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3); }
        .btn-fast:hover { background: #0066d6; box-shadow: 0 0 15px rgba(0, 122, 255, 0.5); }
        
        .btn-normal { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-normal:hover { background: rgba(255,255,255,0.15); }

        @media (max-width: 900px) {
            .nav-links { display: none; }
            .header h1 { font-size: 40px; }
            .glass-panel { padding: 20px; }
            .download-actions { flex-direction: column; }
            .btn-sm { width: 100%; }
        }
    </style>
</head>
<body>

                            <div class="download-actions">
                                <a href="https://ghfast.top/https://github.com/Vertex-Wu/AuraWeather/releases/download/v1.4.0/AuraWeather_Setup_v1.4.0.exe" class="btn-sm btn-fast">高速镜像</a>

    </main>
</body>
